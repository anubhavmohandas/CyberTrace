# --- OnionMail: one platform, independent operators -------------------------
# The negative control the whole engine exists to pass, finally instantiated
# with enough members to be a real test rather than a single server.
#
# Every one of these is a server of the same federated mail platform. They serve
# an identical page template (one DOM simhash across all 26), answer with the
# same `Server: OnionMail` banner, and reference the same three platform hosts —
# onionmail.info, tramaci.org (the software author) and mes3hacklab.org. They
# are run by different people, and each serves its own distinct certificate at
# /<name>.pem: 26 servers, 26 different certificate hashes.
#
# Basis for every row: onionmail.info publishes the server directory these were
# taken from, which is a statement by the platform and not by CyberTrace.
