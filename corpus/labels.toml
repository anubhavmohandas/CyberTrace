# Ground truth for the CyberTrace evaluation corpus.
#
# Every claim the correlation engine makes is about a PAIR of targets, so this
# file labels the *targets* and lets tools/eval_corpus.py derive all pair labels
# from them:
#
#   same operator, different operator, same platform  ->  SAME_OPERATOR
#   different operator, same platform                 ->  SAME_ECOSYSTEM
#   different operator, different platform            ->  UNRELATED
#   either side has operator = ""                     ->  unlabeled, not scored
#
# Deriving pairs beats enumerating them: 17 targets are 136 pairs, and a
# hand-written pair list goes stale the moment a target is added.
#
# `basis` is the rule that makes this a ground truth rather than another guess:
# it must cite something checkable outside the tool's own output — the site's
# own published mirror list, a directory that PGP-verifies its entries, or
# infrastructure the site itself names. If the only reason to believe two
# targets are related is that CyberTrace said so, the label is not evidence, it
# is the tool grading its own homework, and it does not belong here.
#
# SAME_ECOSYSTEM is the label that matters most. Several servers of one mail
# platform share the platform's domain, its documentation addresses and its
# software banner while being run by different people. An engine that cannot
# separate those from a shared operator is not solving the attribution problem,
# it is counting coincidences — so those pairs are labeled explicitly and the
# eval reports them as their own class instead of folding them into UNRELATED.

[corpus]
name = "cybertrace-eval-v1"
collected = "2026-08-13"
note = "Live Tor captures; see runs/raw/ for the saved --save JSON each row came from."

# --- Riseup: one operator, seven onion services -----------------------------
# Riseup publishes the service -> onion mapping itself, at
# /en/security/network-security/tor on its own onion. That page is the basis
# for every row below: the operator naming its own addresses is a stronger
# claim than a third-party directory repeating them, and it is checkable
# without consulting anything CyberTrace produced.
#
# Read the recall number for this family with its evidence class in mind. All
# seven share the riseup.net namespace and little else, so they test whether
# the engine can promote a *public-service domain signal* — which is exactly
# the promotion that manufactures false attribution elsewhere. They are real
# positives, but they are not evidence that operator-specific reuse is
# detected. Only the DNMX pair below tests that.

[[target]]
name = "riseup-main"
onion = "vww6ybal4bd7szmgncyruucpgfkqahzddi37ktceo3ah7ngmcopnpyyd.onion"
operator = "riseup"
platform = "riseup"
basis = "Riseup's own onion services page lists this as riseup.net / help.riseup.net; dark.fail also publishes it under its PGP-signed listing"

