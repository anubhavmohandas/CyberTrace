# --- ENCRYPTED SUPPORT LLC: one operator, two brands ------------------------
# One operator, two separately-branded sites — the only pair here that shares no
# name. Every other operator family shares a word: Riseup's servers share
# `riseup.net`, DNMX's mirrors share the DNMX brand, Endchan's two addresses
# serve the same board. These two do not, so nothing about the brand can carry
# the label and the basis has to be a published statement.
#
# It is: each site's own /wiki/Impressum names ENCRYPTED SUPPORT LLC (A Series
# of OTOCO RMI LLC, registration 966308, Majuro) as the operating entity, with
# the same phone number on both, and Whonix's own wiki publishes the Kicksecure
# onion below. That was verified page-by-page on 2026-08-15, not taken from a
# directory.
#
# The class is `namespace`, and the distinction is the whole point of the row.
# What the two captures actually share is 26 referenced clearnet hosts out of 40
# each — facebook.com, stackexchange, mediawiki.org, the Debian and VirtualBox
# forums — because they are the same wiki software writing about the same
# subject. Exactly ONE of those 26 is attributive: `encrypted-support.com`, the
# LLC's own domain, referenced by both. That is a co-referenced host, the same
# evidence shape as riseup.net, and promoting it is the move that would link any
# two privacy wikis on the web. Their donation wallets are different addresses,
# and they share no mailbox and no key. So a miss here is correct behaviour.
#
# The obvious rescue is rarity: `encrypted-support.com` is referenced by these
# two targets and by nothing else in the corpus, so score a co-referenced host
# by how few sites cite it and the pair comes back. That was measured on
# 2026-08-15 rather than argued, over every domain in the store:
#
#   domains cited by exactly 2 targets   72 same-operator, 4 unrelated  (0.95)
#   domains cited by exactly 3 targets    9 same-operator, 6 unrelated  (0.60)
#
# So the rule buys 0.95 precision where the engine holds 1.00, and the four it
# invents are the co-reference controls this corpus was built out of:
# `pogachan.icu` (pogachan ~ 81chan), `8kun.top` (endchan ~ itinerarium-mentis),
# `blog.itinerariummentis.org` (deep-swarm ~ itinerarium-mentis) and — the one
# that settles it — `archive.ph`, which would attribute zzzchan and Kicksecure
# to one operator. Whonix and Kicksecure uniquely share `archive.today`. The
# same evidence shape, at the same rarity, on the same kind of host: one
# instance is the true pair and the other is two strangers who both link a web
# archive. Rarity cannot tell those apart, because what is missing is not
# frequency information but the fact that one of the 24 uniquely-shared hosts
# belongs to the operator — which is exactly what the pages never say.
#
# What would make this operator-specific is on a page the engine does not read:
# the Impressum is not in the crawler's priority set, and a phone number is not
# an entity type. Both are recorded here as limitations rather than chased —
# building an extractor to make one corpus pair recoverable is how a tool gets
# fitted to its own test set.

