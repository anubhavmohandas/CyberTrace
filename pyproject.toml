[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrace"
version = "1.0.0"
description = "Multi-Layer OSINT Investigation Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anubhav Mohandas"}
]
requires-python = ">=3.10"  # maigret/sherlock-project floor
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[project.scripts]
cybertrace = "cybertrace.cli:main"

[project.urls]
Homepage = "https://github.com/anubhavmohandas/cybertrace"
Repository = "https://github.com/anubhavmohandas/cybertrace"

[tool.setuptools.packages.find]
where = ["."]
include = ["cybertrace*"]
